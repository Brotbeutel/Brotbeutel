<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Brotbeutel.exe — developer desktop</title>
<desc id="desc">A Windows 2000 inspired desktop window showing a small code editor, keyboard project details and a classic status bar.</desc>
<defs>
  <linearGradient id="titlebar" x2="1" y2="0">
    <stop offset="0" stop-color="#60513e"/><stop offset="1" stop-color="#3a3124"/>
  </linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <path d="M0 0H4" stroke="#fff" stroke-opacity=".025"/>
  </pattern>
</defs>
<!-- Desktop background -->
<rect width="1200" height="420" fill="#2a2826"/>
<rect x="20" y="17" width="1160" height="386" fill="#3c3836" stroke="#1e1c1a" stroke-width="7"/>
<path d="M24 21H1176V399H24Z" fill="none" stroke="#5a544f" stroke-width="3"/>
<!-- Main window title bar -->
<rect x="29" y="27" width="1142" height="42" fill="url(#titlebar)"/>
<g transform="translate(42 36)">
  <!-- tiny pixel app icon -->
  <rect width="23" height="23" fill="#b9aa8e" stroke="#211f1c" stroke-width="2"/>
  <rect x="3" y="3" width="17" height="12" fill="#596c63"/>
  <path d="M4 17h15M8 20h7" stroke="#40382e" stroke-width="2"/>
  <rect x="7" y="6" width="5" height="5" fill="#d4c39e"/>
  <rect x="14" y="8" width="4" height="4" fill="#c49a61"/>
</g>
<text x="76" y="55" fill="#f0e6d2" font-family="monospace" font-size="21" font-weight="bold">Brotbeutel.exe — Developer Workspace</text>
<!-- Window controls -->
<rect x="1129" y="33" width="31" height="29" fill="#3c3836" stroke="#1e1c1a" stroke-width="2"/>
<path d="M1133 37l23 21M1156 37l-23 21" stroke="#e8e0d5" stroke-width="2"/>
<!-- Inner workspace -->
<rect x="30" y="70" width="1140" height="315" fill="#3c3836"/>
<!-- Toolbar / menu -->
<rect x="31" y="72" width="1138" height="30" fill="#3c3836"/>
<text x="48" y="92" fill="#e8e0d5" font-family="monospace" font-size="14">File</text>
<text x="88" y="92" fill="#e8e0d5" font-family="monospace" font-size="14">Edit</text>
<text x="130" y="92" fill="#e8e0d5" font-family="monospace" font-size="14">View</text>
<text x="181" y="92" fill="#e8e0d5" font-family="monospace" font-size="14">Build</text>
<text x="236" y="92" fill="#e8e0d5" font-family="monospace" font-size="14">Debug</text>
<text x="300" y="92" fill="#e8e0d5" font-family="monospace" font-size="14">Help</text>
<path d="M32 103H1168" stroke="#1e1c1a" stroke-width="2"/>
<!-- Left editor pane -->
<rect x="43" y="115" width="690" height="224" fill="#2b2826" stroke="#1e1c1a" stroke-width="3"/>
<rect x="46" y="118" width="684" height="25" fill="#514b43"/>
<text x="59" y="136" fill="#e8e0d5" font-family="monospace" font-size="13">profile_readme.md</text>
<text x="58" y="166" fill="#a3998e" font-family="monospace" font-size="13">01</text>
<text x="89" y="166" fill="#c29b62" font-family="monospace" font-size="15"># Hi, I'm Jannik</text>
<text x="58" y="190" fill="#a3998e" font-family="monospace" font-size="13">02</text>
<text x="89" y="190" fill="#e8e0d5" font-family="monospace" font-size="14">I build mechanical keyboards and write the tools around them.</text>
<text x="58" y="218" fill="#a3998e" font-family="monospace" font-size="13">03</text>
<text x="89" y="218" fill="#c29b62" font-family="monospace" font-size="15">## Projects</text>
<text x="58" y="244" fill="#a3998e" font-family="monospace" font-size="13">04</text>
<text x="89" y="244" fill="#8fa58a" font-family="monospace" font-size="14">- J80-3000 / QMK</text>
<text x="58" y="268" fill="#a3998e" font-family="monospace" font-size="13">05</text>
<text x="89" y="268" fill="#8fa58a" font-family="monospace" font-size="14">- Lucky65 V2 ISO</text>
<text x="58" y="292" fill="#a3998e" font-family="monospace" font-size="13">06</text>
<text x="89" y="292" fill="#8fa58a" font-family="monospace" font-size="14">- Fat Plate Generator</text>
<text x="58" y="316" fill="#a3998e" font-family="monospace" font-size="13">07</text>
<text x="89" y="316" fill="#e8e0d5" font-family="monospace" font-size="14">while (curious) { keep_building(); }</text>
<rect x="421" y="302" width="9" height="17" fill="#c29b62">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1.1s" repeatCount="indefinite"/>
</rect>
<!-- Right pane: pixel-art desktop PC -->
<rect x="750" y="115" width="402" height="224" fill="#2b2826" stroke="#1e1c1a" stroke-width="3"/>
<text x="772" y="141" fill="#c29b62" font-family="monospace" font-size="14" font-weight="bold">[ WORKBENCH ]</text>
<!-- monitor -->
<g transform="translate(864 153)" shape-rendering="crispEdges">
  <rect x="0" y="0" width="158" height="103" fill="#b5a78d" stroke="#161513" stroke-width="5"/>
  <rect x="8" y="8" width="142" height="79" fill="#596c63" stroke="#49443a" stroke-width="3"/>
  <rect x="15" y="15" width="128" height="65" fill="#333d39"/>
  <text x="24" y="35" fill="#e8e0d5" font-family="monospace" font-size="10">C:\DEV\KEYBOARDS</text>
  <text x="24" y="52" fill="#c29b62" font-family="monospace" font-size="10">&gt; qmk compile</text>
  <text x="24" y="68" fill="#9eae8d" font-family="monospace" font-size="10">Build complete_</text>
  <rect x="70" y="103" width="22" height="15" fill="#9d9078"/>
  <rect x="51" y="117" width="62" height="8" fill="#b5a78d" stroke="#161513" stroke-width="2"/>
  <rect x="16" y="130" width="128" height="17" fill="#c2b398" stroke="#161513" stroke-width="3"/>
  <g fill="#514b3c">
    <rect x="23" y="134" width="10" height="8"/><rect x="37" y="134" width="10" height="8"/><rect x="51" y="134" width="10" height="8"/><rect x="65" y="134" width="10" height="8"/><rect x="79" y="134" width="10" height="8"/><rect x="93" y="134" width="10" height="8"/><rect x="107" y="134" width="10" height="8"/><rect x="121" y="134" width="16" height="8"/>
  </g>
</g>
<text x="772" y="324" fill="#a3998e" font-family="monospace" font-size="12">JAVA  /  PYTHON  /  QMK  /  3D</text>
<!-- bottom status bar -->
<rect x="43" y="350" width="1109" height="25" fill="#3c3836" stroke="#1e1c1a" stroke-width="2"/>
<path d="M45 352H1150M45 352V373" stroke="#5a544f" stroke-width="2"/>
<text x="57" y="368" fill="#a3998e" font-family="monospace" font-size="12">Status: Ready</text>
<text x="1137" y="368" fill="#a3998e" font-family="monospace" font-size="12" text-anchor="end">BUILD: OK   |   COM1: 9600 BAUD</text>
<rect width="1200" height="420" fill="url(#scan)"/>
</svg>